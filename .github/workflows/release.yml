name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag_name: ${{ steps.release_tag.outputs.tag_name }}
      valid: ${{ steps.release_tag.outputs.valid }}
      version: ${{ steps.release_tag.outputs.version }}

    steps:
      - name: Validate release tag
        id: release_tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ ! "$TAG_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice title=Skipped release::Tag '$TAG_NAME' is not a three-part semantic version."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit

      - name: Run baseline verification
        run: bun run verify

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

  release:
    name: Create GitHub Release
    needs: [validate, verify]
    if: needs.validate.outputs.valid == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi

          RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          RELEASE_NOTES_API="repos/$GITHUB_REPOSITORY/contents/changelog/v${RELEASE_VERSION}.md?ref=${TAG_NAME}"

          if RELEASE_NOTES_CONTENT="$(gh api "$RELEASE_NOTES_API" --jq .content 2>/dev/null)"; then
            printf '%s' "$RELEASE_NOTES_CONTENT" | base64 --decode > "$RELEASE_NOTES_FILE"
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TRAUMA $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES_FILE" \
              --verify-tag
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TRAUMA $RELEASE_VERSION" \
              --generate-notes \
              --verify-tag
          fi
