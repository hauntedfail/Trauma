name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "AGENTS.md"
      - "Backlog.md"
      - "CLAUDE.md"
      - "README.md"
      - "scripts/check-docs.ts"
      - "package.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "AGENTS.md"
      - "Backlog.md"
      - "CLAUDE.md"
      - "README.md"
      - "scripts/check-docs.ts"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Check documentation
        run: bun run docs:check
