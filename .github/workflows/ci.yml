name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "public/**"
      - "drizzle/**"
      - "scripts/**"
      - "app.config.ts"
      - "drizzle.config.ts"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - "trauma.config.example.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "public/**"
      - "drizzle/**"
      - "scripts/**"
      - "app.config.ts"
      - "drizzle.config.ts"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - "trauma.config.example.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run audit

      - name: Run baseline verification
        run: bun run verify

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: bun run test:e2e
