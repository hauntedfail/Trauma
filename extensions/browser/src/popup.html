<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TRAUMA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f4;
        --bg-tint: #f3f0ec;
        --fg-1: #111827;
        --fg-2: #374151;
        --border: #d8ded5;
        --border-strong: #b8c4b1;
        --accent: #7a1b25;
        --accent-hover: #62141d;
        --accent-ink: #fffefa;
        --accent-soft: #f4dadd;
        --accent-soft-ink: #4a0f16;
        --danger: #b42121;
        --success: #0b6b3a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0d0f;
          --bg-tint: #1e2127;
          --fg-1: #e4e4e0;
          --fg-2: #b9bab4;
          --border: #262930;
          --border-strong: #393e48;
          --accent: #c86c7e;
          --accent-hover: #d28490;
          --accent-ink: #0a0a0a;
          --accent-soft: #2e090d;
          --accent-soft-ink: #f4dadd;
          --danger: #f08a8a;
          --success: #6fcf97;
        }
      }

      body {
        margin: 0;
        min-width: 420px;
        color: var(--fg-1);
        background: var(--bg);
      }

      .shell {
        display: grid;
        grid-template-columns: 116px 1fr;
        min-height: 268px;
      }

      .sidebar {
        display: grid;
        align-content: start;
        gap: 2px;
        border-right: 1px solid var(--border);
        padding: 12px 8px;
      }

      .brand {
        font-size: 18px;
        font-weight: 800;
        padding: 8px;
      }

      .nav-button,
      .primary-button,
      .secondary-button {
        min-height: 36px;
        border: 1px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
      }

      .nav-button:focus-visible,
      .primary-button:focus-visible,
      .secondary-button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .nav-button {
        width: 100%;
        padding: 6px 12px;
        text-align: left;
        background: transparent;
        color: var(--fg-2);
      }

      .nav-button:hover {
        background: var(--bg-tint);
        color: var(--fg-1);
      }

      .nav-button[aria-current="page"] {
        background: var(--accent-soft);
        color: var(--accent-soft-ink);
      }

      .content {
        display: grid;
        align-content: start;
        padding: 16px;
      }

      .view {
        display: grid;
        gap: 8px;
      }

      .view[hidden] {
        display: none;
      }

      .page-url {
        overflow: hidden;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 4px;
        color: var(--fg-2);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .primary-button {
        width: 100%;
        padding: 6px 14px;
        color: var(--accent-ink);
        background: var(--accent);
      }

      .primary-button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .primary-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .secondary-button {
        width: 100%;
        padding: 6px 14px;
        border-color: var(--border);
        background: transparent;
        color: var(--fg-1);
      }

      .secondary-button:hover {
        background: var(--bg-tint);
      }

      label {
        display: block;
        margin-top: 4px;
        color: var(--fg-2);
        font-size: 12px;
        font-weight: 700;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        padding: 8px 12px;
        background: var(--bg);
        color: var(--fg-1);
        font: inherit;
        font-size: 14px;
      }

      .status {
        min-height: 20px;
        color: var(--fg-2);
        font-size: 13px;
        line-height: 1.4;
      }

      .status[data-kind="error"] {
        color: var(--danger);
      }

      .status[data-kind="success"] {
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">TRAUMA</div>
        <button id="nav-import" class="nav-button" type="button" aria-current="page">
          Import
        </button>
        <button id="nav-settings" class="nav-button" type="button">Settings</button>
      </aside>
      <main class="content">
        <section id="view-import" class="view">
          <div id="current-url" class="page-url">Reading current tab...</div>
          <button id="import-button" class="primary-button" type="button">
            Add this page to memory
          </button>
          <button id="open-trauma-button" class="secondary-button" type="button">
            Open TRAUMA
          </button>
          <div id="import-status" class="status" role="status"></div>
        </section>
        <section id="view-settings" class="view" hidden>
          <label for="trauma-url">TRAUMA instance address</label>
          <input id="trauma-url" type="url" spellcheck="false" />
          <label for="token">Browser import token</label>
          <input id="token" type="password" spellcheck="false" />
          <button id="save-settings-button" class="primary-button" type="button">
            Save settings
          </button>
          <div id="settings-status" class="status" role="status"></div>
        </section>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
