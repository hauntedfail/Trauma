<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TRAUMA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-width: 420px;
        color: #0f1419;
        background: #ffffff;
      }

      .shell {
        display: grid;
        grid-template-columns: 116px 1fr;
        min-height: 268px;
      }

      .sidebar {
        border-right: 1px solid #eff3f4;
        padding: 12px 8px;
      }

      .brand {
        font-size: 18px;
        font-weight: 800;
        padding: 8px;
      }

      .nav-button,
      .primary-button,
      .secondary-button {
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
      }

      .nav-button {
        width: 100%;
        padding: 10px 12px;
        text-align: left;
        background: transparent;
        color: inherit;
      }

      .nav-button[aria-current="page"],
      .nav-button:hover {
        background: #eff3f4;
      }

      .content {
        padding: 16px;
      }

      .view[hidden] {
        display: none;
      }

      .page-url {
        overflow: hidden;
        padding: 10px 12px;
        border: 1px solid #cfd9de;
        border-radius: 8px;
        margin: 12px 0;
        color: #536471;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .primary-button {
        width: 100%;
        padding: 12px 16px;
        color: #ffffff;
        background: #0f1419;
        font-weight: 700;
      }

      .primary-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .secondary-button {
        padding: 10px 14px;
        background: #eff3f4;
        color: #0f1419;
        font-weight: 700;
      }

      label {
        display: block;
        margin: 12px 0 6px;
        color: #536471;
        font-size: 12px;
        font-weight: 700;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #cfd9de;
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }

      .status {
        min-height: 20px;
        margin-top: 12px;
        color: #536471;
        font-size: 13px;
        line-height: 1.4;
      }

      .status[data-kind="error"] {
        color: #b00020;
      }

      .status[data-kind="success"] {
        color: #007a3d;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">TRAUMA</div>
        <button id="nav-import" class="nav-button" type="button" aria-current="page">
          Import
        </button>
        <button id="nav-settings" class="nav-button" type="button">Settings</button>
      </aside>
      <main class="content">
        <section id="view-import" class="view">
          <div id="current-url" class="page-url">Reading current tab...</div>
          <button id="import-button" class="primary-button" type="button">
            Add this page to memory
          </button>
          <button id="open-trauma-button" class="secondary-button" type="button">
            Open TRAUMA
          </button>
          <div id="import-status" class="status" role="status"></div>
        </section>
        <section id="view-settings" class="view" hidden>
          <label for="trauma-url">TRAUMA instance address</label>
          <input id="trauma-url" type="url" spellcheck="false" />
          <label for="token">Browser import token</label>
          <input id="token" type="password" spellcheck="false" />
          <button id="save-settings-button" class="primary-button" type="button">
            Save settings
          </button>
          <div id="settings-status" class="status" role="status"></div>
        </section>
      </main>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
